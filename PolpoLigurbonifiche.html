<style>
  /* ============================================================
     OCTOPUS 3D — ELEMENTOR WIDGET
     ============================================================ */

  #octo3d-widget {
    --octo-height: 720px;

    --octo-background-top: #ffffff;
    --octo-background-bottom: #ececef;

    --octo-panel: rgba(255, 255, 255, 0.80);

    --octo-accent: #d9aa22;

        var(--octo-background-bottom) 100%
      );

    color: var(--octo-text);

    font-family:
      Inter,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      Arial,
      sans-serif;

    isolation: isolate;
  }

  #octo3d-widget *,
  #octo3d-widget *::before,
  #octo3d-widget *::after {
    box-sizing: border-box;

    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;
  }

  #octo3d-widget canvas {
    display: block;

    width: 100% !important;
    height: 100% !important;

    touch-action: none;

  #octo3d-widget canvas:active {

  /* ============================================================
     TOP UI
     ============================================================ */

  #octo3d-widget .octo3d-top {
    position: absolute;
    z-index: 20;

    top: 18px;
    left: 18px;

    display: flex;

  }

  #octo3d-widget .octo3d-info,

  #octo3d-widget .octo3d-title {
    font-size: clamp(21px, 2vw, 29px);

  #octo3d-widget .octo3d-description {

  /* ============================================================
     BUTTONS
     ============================================================ */

  #octo3d-widget .octo3d-actions {
    display: flex;

    gap: 6px;

    padding: 6px;

  #octo3d-widget .octo3d-button {

  #octo3d-widget .octo3d-button:active {

  /* ============================================================
     HELP
     ============================================================ */

  #octo3d-widget .octo3d-help {
    position: absolute;
    z-index: 15;

    left: 50%;

    transform: translateX(-50%);

    display: flex;

  #octo3d-widget .octo3d-help span + span::before {

  /* ============================================================

     ============================================================ */

  #octo3d-widget .octo3d-loading {

  #octo3d-widget .octo3d-loader {

  #octo3d-widget .octo3d-spinner {

  @keyframes octo3d-spinner-animation {

  #octo3d-widget .octo3d-loader-title {

  #octo3d-widget .octo3d-loader-status {

  #octo3d-widget .octo3d-progress-track {
    width: 100%;
    height: 6px;

    overflow: hidden;

    border-radius: 999px;

  }

  #octo3d-widget .octo3d-progress {
    width: 0%;
    height: 100%;

    border-radius: inherit;

    background:
      linear-gradient(
        90deg,
        #ca9211,

      );

      width 0.15s ease;

  #octo3d-widget .octo3d-error {
    display: none;

  #octo3d-widget .octo3d-error.is-visible {

  /* ============================================================
     FULLSCREEN

  #octo3d-widget:fullscreen {

  #octo3d-widget:-webkit-full-screen {

  /* ============================================================
     TABLET
     ============================================================ */

  @media (max-width: 900px) {
    #octo3d-widget {

    }

    #octo3d-widget .octo3d-info {

  /* ============================================================
     MOBILE
     ============================================================ */

  @media (max-width: 767px) {
    #octo3d-widget {

</style>

<script type="module">
  /*
   * ============================================================
   * IMPORTANTISSIMO PER ELEMENTOR
   *
   * Usiamo esm.sh anziché i file addons di jsDelivr.
   * esm.sh risolve automaticamente gli import interni di Three.js.
   * ============================================================
   */

  import * as THREE
    from "https://esm.sh/three@0.180.0";

  import { OrbitControls }
    from "https://esm.sh/three@0.180.0/examples/jsm/controls/OrbitControls.js";

  import { GLTFLoader }
    from "https://esm.sh/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";


  (() => {

    /* ==========================================================
       CONFIGURAZIONE
       ========================================================== */

    const MODEL_URL =
      "https://raw.githubusercontent.com/giuseppebarbieri1965-afk/polpo/refs/heads/main/PolpoLigurbonifiche.glb";

    const root =
      document.querySelector("#octo3d-widget");

    if (!root) {
      console.error(
        "[Octopus 3D] Contenitore non trovato."
      );

      return;
    }

    /*
     * Elementor può reinizializzare il widget
     * quando si lavora nell'editor.
     */

    if (root.dataset.octo3dInitialized === "1") {
      return;
    }

    root.dataset.octo3dInitialized = "1";


    /* ==========================================================
       ELEMENTI DOM
       ========================================================== */

    const stage =
      root.querySelector(".octo3d-stage");

    const loading =
      root.querySelector(".octo3d-loading");

    const spinner =
      root.querySelector(".octo3d-spinner");

    const loaderTitle =
      root.querySelector(".octo3d-loader-title");

    const loaderStatus =
      root.querySelector(".octo3d-loader-status");

    const progress =
      root.querySelector(".octo3d-progress");

    const errorBox =
      root.querySelector(".octo3d-error");

    const rotateButton =
      root.querySelector(".octo3d-rotate");

    const resetButton =
      root.querySelector(".octo3d-reset");

    const fullscreenButton =
      root.querySelector(".octo3d-fullscreen");


    /* ==========================================================
       SCENA
       ========================================================== */

    const scene =
      new THREE.Scene();

    scene.background =
      new THREE.Color(0xf3f3f5);


    /* ==========================================================
       CAMERA
       ========================================================== */

    const camera =
      new THREE.PerspectiveCamera(
        35,
        1,
        0.01,
        1000
      );


    /* ==========================================================
       RENDERER
       ========================================================== */

    let renderer;

    try {

      renderer =
        new THREE.WebGLRenderer({
          antialias: true,
          alpha: false,
          powerPreference: "high-performance"
        });

    } catch (error) {

      console.error(
        "[Octopus 3D] Errore WebGL:",
        error
      );

      displayError(
        "Questo dispositivo o browser non supporta WebGL."
      );

      return;
    }

    renderer.outputColorSpace =
      THREE.SRGBColorSpace;

    renderer.toneMapping =
      THREE.ACESFilmicToneMapping;

    renderer.toneMappingExposure =
      1.05;

    renderer.shadowMap.enabled =
      true;

    renderer.shadowMap.type =
      THREE.PCFSoftShadowMap;

    stage.appendChild(
      renderer.domElement
    );


    /* ==========================================================
       CONTROLLI
       ========================================================== */

    const controls =
      new OrbitControls(
        camera,
        renderer.domElement
      );

    controls.enableDamping =
      true;

    controls.dampingFactor =
      0.055;

    controls.enablePan =
      false;

    controls.rotateSpeed =
      0.72;

    controls.zoomSpeed =
      0.9;

    /*
     * Rotazione automatica iniziale.
     */

    controls.autoRotate =
      true;

    controls.autoRotateSpeed =
      0.7;


    /* ==========================================================
       LUCI
       ========================================================== */

    const hemisphereLight =
      new THREE.HemisphereLight(
        0xffffff,
        0x87838d,
        2.25
      );

    scene.add(
      hemisphereLight
    );


    const keyLight =
      new THREE.DirectionalLight(
        0xffffff,
        3.2
      );

    keyLight.position.set(
      5,
      8,
      7
    );

    keyLight.castShadow =
      true;

    keyLight.shadow.mapSize.set(
      1024,
      1024
    );

    keyLight.shadow.bias =
      -0.0001;

    scene.add(
      keyLight
    );


    const fillLight =
      new THREE.DirectionalLight(
        0xffddbd,
        1.1
      );

    fillLight.position.set(
      -5,
      4,
      5
    );

    scene.add(
      fillLight
    );


    const rimLight =
      new THREE.DirectionalLight(
        0xdbe8ff,
        1.25
      );

    rimLight.position.set(
      5,
      6,
      -7
    );

    scene.add(
      rimLight
    );


    /* ==========================================================
       PAVIMENTO
       ========================================================== */

    const floorMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xe9e9ec,
        roughness: 0.95,
        metalness: 0
      });


    const floor =
      new THREE.Mesh(
        new THREE.CircleGeometry(
          10,
          64
        ),
        floorMaterial
      );

    floor.rotation.x =
      -Math.PI / 2;

    floor.receiveShadow =
      true;

    scene.add(
      floor
    );


    /* ==========================================================
       MODELLO
       ========================================================== */

    let model = null;

    let modelSize = 1;

    const modelGroup =
      new THREE.Group();

    scene.add(
      modelGroup
    );


    /*
     * Posizioni usate per il reset.
     */

    const homeCameraPosition =
      new THREE.Vector3();

    const homeTarget =
      new THREE.Vector3();


    /* ==========================================================
       LOADER GLB
       ========================================================== */

    const loader =
      new GLTFLoader();


    loader.load(
      MODEL_URL,

      (gltf) => {

        console.log(
          "[Octopus 3D] GLB caricato correttamente.",
          gltf
        );

        model =
          gltf.scene;

        if (!model) {

          displayError(
            "Il GLB non contiene una scena 3D valida."
          );

          return;
        }


        /*
         * Ombre e materiali.
         */

        model.traverse(
          (object) => {

            if (!object.isMesh) {
              return;
            }

            object.castShadow =
              true;

            object.receiveShadow =
              true;


            const materials =
              Array.isArray(object.material)
                ? object.material
                : [object.material];


            materials.forEach(
              (material) => {

                if (!material) {
                  return;
                }

                /*
                 * Non alteriamo le texture
                 * incorporate nel GLB.
                 */

                material.needsUpdate =
                  true;

              }
            );

          }
        );


        modelGroup.add(
          model
        );


        /*
         * Importantissimo:
         * facciamo prima il resize del canvas,
         * POI calcoliamo la camera.
         */

        resizeRenderer();

        fitModelToScreen(
          model
        );


        progress.style.width =
          "100%";

        loaderStatus.textContent =
          "Modello pronto";


        window.setTimeout(
          () => {

            loading.classList.add(
              "is-hidden"
            );

          },
          350
        );

      },


      /*
       * PROGRESS
       */

      (xhr) => {

        const loadedMB =
          xhr.loaded /
          1024 /
          1024;


        if (
          xhr.lengthComputable &&
          xhr.total > 0
        ) {

          const totalMB =
            xhr.total /
            1024 /
            1024;


          const percentage =
            Math.min(
              100,
              (
                xhr.loaded /
                xhr.total
              ) * 100
            );


          progress.style.width =
            `${percentage}%`;


          loaderStatus.textContent =
            `${Math.round(percentage)}% · ${loadedMB.toFixed(1)} / ${totalMB.toFixed(1)} MB`;

        } else {

          loaderStatus.textContent =
            `${loadedMB.toFixed(1)} MB scaricati`;

        }

      },


      /*
       * ERROR
       */

      (error) => {

        console.error(
          "[Octopus 3D] Errore caricamento GLB:",
          error
        );


        displayError(
          "Il modello non è stato caricato. Apri la console del browser per vedere il dettaglio tecnico."
        );

      }
    );


    /* ==========================================================
       FIT MODEL
       ========================================================== */

    function fitModelToScreen(object) {

      object.updateMatrixWorld(
        true
      );


      let box =
        new THREE.Box3()
          .setFromObject(
            object
          );


      if (box.isEmpty()) {

        displayError(
          "Il modello GLB non contiene geometrie visualizzabili."
        );

        return;
      }


      let center =
        box.getCenter(
          new THREE.Vector3()
        );


      /*
       * Centra X e Z.
       */

      object.position.x -=
        center.x;

      object.position.z -=
        center.z;


      /*
       * Appoggia il modello al pavimento.
       */

      object.position.y -=
        box.min.y;


      object.updateMatrixWorld(
        true
      );


      /*
       * Nuovo bounding box.
       */

      box =
        new THREE.Box3()
          .setFromObject(
            object
          );


      const size =
        box.getSize(
          new THREE.Vector3()
        );


      center =
        box.getCenter(
          new THREE.Vector3()
        );


      modelSize =
        Math.max(
          size.x,
          size.y,
          size.z
        );


      if (
        !Number.isFinite(modelSize) ||
        modelSize <= 0
      ) {

        modelSize =
          1;

      }


      /* ========================================================
         CALCOLO DISTANZA CAMERA

         Tiene conto sia della larghezza
         sia dell'altezza del modello.
         ======================================================== */

      const verticalFov =
        THREE.MathUtils.degToRad(
          camera.fov
        );


      const horizontalFov =
        2 *
        Math.atan(
          Math.tan(
            verticalFov / 2
          ) *
          camera.aspect
        );


      const distanceHeight =
        size.y /
        (
          2 *
          Math.tan(
            verticalFov / 2
          )
        );


      const distanceWidth =
        size.x /
        (
          2 *
          Math.tan(
            horizontalFov / 2
          )
        );


      let distance =
        Math.max(
          distanceHeight,
          distanceWidth
        );


      /*
       * Margine visivo.
       */

      distance *=
        1.30;


      /*
       * Vista quasi frontale,
       * leggermente rialzata.
       */

      const direction =
        new THREE.Vector3(
          0.36,
          0.12,
          1
        ).normalize();


      camera.position
        .copy(center)
        .add(
          direction.multiplyScalar(
            distance
          )
        );


      controls.target.copy(
        center
      );


      /* ========================================================
         ZOOM
         ======================================================== */

      controls.minDistance =
        modelSize * 0.45;


      controls.maxDistance =
        modelSize * 5;


      /* ========================================================
         CAMERA NEAR/FAR
         ======================================================== */

      camera.near =
        Math.max(
          modelSize / 1000,
          0.001
        );


      camera.far =
        Math.max(
          modelSize * 100,
          100
        );


      camera.updateProjectionMatrix();


      /* ========================================================
         FLOOR
         ======================================================== */

      floor.position.y =
        box.min.y -
        modelSize * 0.004;


      floor.scale.setScalar(
        Math.max(
          modelSize / 4,
          1
        )
      );


      /* ========================================================
         RESET POSITION
         ======================================================== */

      homeCameraPosition.copy(
        camera.position
      );


      homeTarget.copy(
        controls.target
      );


      controls.update();

    }


    /* ==========================================================
       AUTOROTATE
       ========================================================== */

    let autoRotate =
      true;


    rotateButton.addEventListener(
      "click",
      () => {

        autoRotate =
          !autoRotate;


        controls.autoRotate =
          autoRotate;


        rotateButton.textContent =
          autoRotate
            ? "Pausa"
            : "Ruota";

      }
    );


    /*
     * Quando l'utente interagisce,
     * fermiamo temporaneamente
     * l'autorotazione.
     */

    let autoRotateTimeout =
      null;


    controls.addEventListener(
      "start",
      () => {

        controls.autoRotate =
          false;


        clearTimeout(
          autoRotateTimeout
        );

      }
    );


    controls.addEventListener(
      "end",
      () => {

        if (!autoRotate) {
          return;
        }


        autoRotateTimeout =
          window.setTimeout(
            () => {

              controls.autoRotate =
                true;

            },
            1800
          );

      }
    );


    /* ==========================================================
       RESET CAMERA
       ========================================================== */

    let resetting =
      false;


    let resetTime =
      0;


    const resetCameraStart =
      new THREE.Vector3();


    const resetTargetStart =
      new THREE.Vector3();


    resetButton.addEventListener(
      "click",
      resetView
    );


    function resetView() {

      if (!model) {
        return;
      }


      resetCameraStart.copy(
        camera.position
      );


      resetTargetStart.copy(
        controls.target
      );


      resetTime =
        0;


      resetting =
        true;

    }


    function updateReset(delta) {

      if (!resetting) {
        return;
      }


      resetTime +=
        delta * 2.4;


      const t =
        THREE.MathUtils.clamp(
          resetTime,
          0,
          1
        );


      const eased =
        easeInOutCubic(
          t
        );


      camera.position.lerpVectors(
        resetCameraStart,
        homeCameraPosition,
        eased
      );


      controls.target.lerpVectors(
        resetTargetStart,
        homeTarget,
        eased
      );


      if (t >= 1) {

        camera.position.copy(
          homeCameraPosition
        );


        controls.target.copy(
          homeTarget
        );


        resetting =
          false;

      }

    }


    function easeInOutCubic(t) {

      return t < 0.5
        ? 4 * t * t * t
        : 1 -
          Math.pow(
            -2 * t + 2,
            3
          ) / 2;

    }


    /* ==========================================================
       FULLSCREEN
       ========================================================== */

    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await root.requestFullscreen();

          } else {

            await document.exitFullscreen();

          }

        } catch (error) {

          console.warn(
            "[Octopus 3D] Fullscreen non disponibile:",
            error
          );

        }

      }
    );


    document.addEventListener(
      "fullscreenchange",
      () => {

        fullscreenButton.textContent =
          document.fullscreenElement
            ? "Chiudi"
            : "Fullscreen";


        window.setTimeout(
          resizeRenderer,
          50
        );

      }
    );


    /* ==========================================================
       RESPONSIVE / ELEMENTOR
       ========================================================== */

    function resizeRenderer() {

      const width =
        root.clientWidth;


      const height =
        root.clientHeight;


      if (
        width < 2 ||
        height < 2
      ) {

        return;

      }


      camera.aspect =
        width / height;


      if (width <= 600) {

        camera.fov =
          43;

      } else if (width <= 900) {

        camera.fov =
          38;

      } else {

        camera.fov =
          35;

      }


      camera.updateProjectionMatrix();


      /*
       * Importante:
       * Elementor usa il contenitore,
       * non window.innerWidth.
       */

      renderer.setSize(
        width,
        height,
        false
      );


      /*
       * Limitiamo la risoluzione
       * su display Retina.
       */

      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio || 1,
          1.75
        )
      );

    }


    const resizeObserver =
      new ResizeObserver(
        () => {

          resizeRenderer();

        }
      );


    resizeObserver.observe(
      root
    );


    resizeRenderer();


    /* ==========================================================
       PAUSA QUANDO FUORI VIEWPORT
       ========================================================== */

    let widgetVisible =
      true;


    const intersectionObserver =
      new IntersectionObserver(
        (entries) => {

          widgetVisible =
            entries[0]
              ?.isIntersecting
            ?? true;

        },
        {
          threshold: 0.01
        }
      );


    intersectionObserver.observe(
      root
    );


    /* ==========================================================
       TASTO R
       ========================================================== */

    window.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key.toLowerCase()
          !== "r"
        ) {

          return;

        }


        const rect =
          root.getBoundingClientRect();


        const visible =
          rect.top <
            window.innerHeight &&
          rect.bottom >
            0;


        if (visible) {

          resetView();

        }

      }
    );


    /* ==========================================================
       ERROR HANDLING
       ========================================================== */

    function displayError(message) {

      spinner.style.display =
        "none";


      loaderTitle.textContent =
        "Impossibile visualizzare il modello";


      loaderStatus.textContent =
        "";


      progress.style.width =
        "100%";


      progress.style.background =
        "#d95454";


      errorBox.textContent =
        message;


      errorBox.classList.add(
        "is-visible"
      );

    }


    /* ==========================================================
       RENDER LOOP
       ========================================================== */

    const clock =
      new THREE.Clock();


    function renderLoop() {

      requestAnimationFrame(
        renderLoop
      );


      const delta =
        Math.min(
          clock.getDelta(),
          0.05
        );


      if (!widgetVisible) {

        return;

      }


      updateReset(
        delta
      );


      controls.update();


      renderer.render(
        scene,
        camera
      );

    }


    renderLoop();

  })();
</script>
